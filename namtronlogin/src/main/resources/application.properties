# Shared settings. Do not put real credentials in this tracked file.
spring.application.name=namtronlogin
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=shop_db;encrypt=true;trustServerCertificate=true;loginTimeout=10}
spring.datasource.username=${DB_USERNAME:ismart_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Run database/schema.sql in SSMS first; application startup never creates/alters tables.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# Required: use JWT_SECRET or the ignored local properties file.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
server.port=${SERVER_PORT:8080}
